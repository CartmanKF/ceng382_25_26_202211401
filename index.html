<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naruto Themed Login Screen</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <audio id="bgMusic" loop>
        <source src="Naruto Shippuden - Opening 3  Blue Bird.mp3" type="audio/mpeg">
    </audio>

    <button id="musicToggle" class="music-button">🎵 Play Music</button>

    <div id="clock" class="clock"></div>

    <div class="login-container">
        <h1>Login</h1>
        <form id="loginForm">
            <input type="text" placeholder="Username" id="username" />
            <input type="password" placeholder="Password" id="password" />
            <button type="submit">Login</button>
        </form>
    </div>

    <!Spinning Sharingan>
    <div class="sharingan-wrapper">
        <div class="sharingan-text">Click Sharingan!!!</div>
        <div id="sharingan">
            <div class="pupil"></div>
            <div class="tomoe-container">
                <div id="black-outline">
                    <div class="tomoe-circle-1">
                        <div class="triangle-1"></div>
                    </div>
                    <div class="tomoe-circle-2">
                        <div class="triangle-2"></div>
                    </div>
                    <div class="tomoe-circle-3">
                        <div class="triangle-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Music control
        const audio = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');
        const sharingan = document.getElementById('sharingan');
        const loginContainer = document.querySelector('.login-container');
        let isPlaying = false;
        let isLoginVisible = false;

        // Login array to store credentials
        let loginAttempts = [];

        // Login form handling
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Store login attempt in array
            loginAttempts.push({ username, password });
            
            // Log all attempts to console
            console.log('All Login Attempts:', loginAttempts);
            
            // Clear form
            this.reset();
        });

        // Live Clock
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById('clock').textContent = timeString;
        }
        
        // Update clock every second
        updateClock();
        setInterval(updateClock, 1000);

        // Toggle forms with 'H' key
        let formsVisible = true;
        document.addEventListener('keydown', function(e) {
            if (e.key.toLowerCase() === 'h') {
                const forms = document.getElementsByTagName('form');
                formsVisible = !formsVisible;
                
                for (let form of forms) {
                    form.style.display = formsVisible ? 'block' : 'none';
                }
            }
        });

        // Music control
        musicToggle.addEventListener('click', function() {
            if (isPlaying) {
                audio.pause();
                musicToggle.textContent = '🎵 Play Music';
            } else {
                audio.play();
                musicToggle.textContent = '⏸️ Pause Music';
            }
            isPlaying = !isPlaying;
        });

        // Sharingan click control
        sharingan.addEventListener('click', function() {
            if (!isLoginVisible) {
                loginContainer.classList.add('show');
                isLoginVisible = true;
            } else {
                loginContainer.classList.remove('show');
                isLoginVisible = false;
            }
        });
    </script>
</body>
</html>
